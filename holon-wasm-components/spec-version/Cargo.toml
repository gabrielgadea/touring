[package]
name = "holon-spec-version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "THSF Fase 4 proof-of-life component — exports a single trivial `spec-version` capability via WASI 0.2 component model."

[lib]
name = "holon_spec_version"
# `cdylib` is required to produce a WebAssembly Component. `rlib` lets
# unit tests compile for the host target.
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = { workspace = true }