# `fuzz/` is a standalone cargo-fuzz crate with its own [workspace] table.
# Excluded so `cargo check --workspace` and member builds ignore it; build
# fuzz targets via `cargo +nightly fuzz build` from the repo root.
exclude = ["fuzz"]
resolver = "2"

[[workspace.metadata.leptos]]
name = "touring-web"
packages = [
  { name = "touring-web", path = "crates/touring-web" }
]
default-website-url = "http://0.0.0.0:3000"

# ── W2.6 cargo-machete (workspace-wide ignore list) ──────────────────────
# Wave 2026-05-12 — added by w2_setup_deny_machete.py.
# Lists build-deps that machete cannot statically detect (false-positive
# "unused"). Add additional entries as needed when machete flags legitimate
# proc-macro / build-script deps. cargo-deny config lives at `deny.toml`.
[workspace.metadata.cargo-machete]
ignored = [
    "napi-build",
]

# ── W2.7 cargo-mutants — baseline configuration (advisory) ──────────────
# Wave 2026-05-12 — opt-in mutation coverage baseline for the workspace.
# `cargo-mutants` injects small AST mutations and verifies the test suite
# catches them. A higher catch-rate ⇒ stronger tests.
#
# Strategy: 50% baseline now (informational); ramp to 65% → 75% → 80%
# in W11 (Test Debt Repayment). The CI workflow runs `cargo mutants --in-diff`
# on every PR (fast) and a weekly full scan via the `mutation-baseline` job
# (see `docs/ci-template.yml`). Per-crate overrides go in each crate's
# `Cargo.toml [package.metadata.mutants]` section when needed.
[workspace.metadata.mutants]
# Minimum acceptable kill rate (% of mutants caught). Advisory — does not
# block CI until W11 lands the enforcement gate.
minimum_test_threshold = 50
# Test runs that exceed this multiplier of the baseline time are flagged
# as "timeout suspect" (mutation likely created an infinite loop).
timeout_multiplier = 2.0
# Run mutants in a copy of the workspace so the source remains pristine
# during incremental testing.
copy_target = true
# Skip mutants on identifiers matching this regex. Conservatives that are
# universally test-irrelevant (logging, telemetry).
exclude_re = "(?i)(log|trace|debug|tracing|metric)"

# ── Shared Package Metadata (inherited via `license.workspace = true` etc) ─
# Adding these here fixes the cargo-deny `unlicensed` violation across all
# member crates without duplicating the same line in 17 Cargo.toml files.
# ── Shared Package Metadata (inherited via `license.workspace = true` etc) ─
# Adding these here fixes the cargo-deny `unlicensed` violation across all
# member crates without duplicating the same line in 17 Cargo.toml files.
[workspace.package]
# Single source of truth for the product version (Productization Fase 0):
# member crates inherit via `version.workspace = true`; the binary derives it
# through `env!("CARGO_PKG_VERSION")`. 30.3.0 matches the daemon's public
# version (constitution/docs); the GA SemVer rebrand is a Fase 5 decision.
version = "30.3.1"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Gabriel Gadea"]
# CICD-05 (repo identity, 2026-06-16): canonical project identity for crates.io /
# docs.rs / SBOM provenance. The repository URL matches the one `scripts/install.sh`
# already resolves (`TOURING_REPO=gabrielgadea/touring`). Member crates inherit any
# of these via `<field>.workspace = true`.
repository = "https://github.com/gabrielgadea/touring"
homepage = "https://github.com/gabrielgadea/touring"
documentation = "https://docs.rs/touring"
description = "Touring — an agentic code-intelligence daemon: AST/wiring/index analysis, RL-guided suggestions, and a sandboxed code-execution gateway."
keywords = ["code-intelligence", "ast", "agentic", "daemon", "rust"]
categories = ["development-tools", "command-line-utilities"]
publish = false

# ── Workspace Dependencies (shared across all crates) ──────────────────
# Version conflicts resolved: dashmap 6.1 (touring wins), notify 7.0 (touring wins)
[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# Persistence
rusqlite = { version = "0.38", features = ["bundled"] }
deadpool-sqlite = "0.13"
sha2 = "0.10"

# Concurrency
rayon = "1.10"
dashmap = "6.1"
pollster = "0.3"
tokio = { version = "1.40", features = ["full"] }

# Collections
lru = "0.16" # >=0.16.3 fixes RUSTSEC-2026-0002 (IterMut Stacked-Borrows unsoundness); API (LruCache::new(NonZeroUsize)/get/put) unchanged from 0.12
indexmap = "2.6"
moka = { version = "0.12", features = ["sync", "future"] }
uuid = { version = "1", features = ["v4", "serde"] }
semver = { version = "1", features = ["serde"] }
camino = { version = "1.1", features = ["serde1"] }
tera = "1.20"
either = "1.13"
num_cpus = "1.16"

# Graph
petgraph = { version = "0.6", features = ["serde-1"] }


# touring-foundation is the foundational crate (renamed from touring-core in W3.1 2026-05-12).
# touring-core shim REMOVED 2026-05-23 (S-11 PE-A) — was 0-consumer; foundation absorbed it.
touring-foundation = { path = "crates/touring-foundation" }

# touring-ast, touring-analysis, touring-cognitive are referenced via path-based
# workspace members only (no version needed since they inherit from [workspace])
touring-analysis = { path = "crates/touring-analysis" }

# Patterns
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode"] }
once_cell = "1.20"
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
# miette: diagnostic-rich error reporting for CILA-budget-friendly LLM feedback.
# Derives `Diagnostic` on top of thiserror; output includes code/help/url/snippet.
miette = { version = "7", features = ["fancy"] }

# syntect: Sublime Text-style syntax highlighting for terminal/HTML output.
# Wave 5 (2026-04-26) — used by `touring ast highlight` CLI and future
# miette SourceCode integrations. We pick `regex-onig` because the workspace
# already pulls onig 6.5.1 transitively via candle-transformers (zero new C
# compilation). `regex-fancy` is a git dep in upstream syntect that conflicts
# with the workspace pin of fancy-regex 0.13.0 — DO NOT enable.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "dump-load", "parsing", "regex-onig"] }

# HTTP
# Use rustls-tls exclusively — avoids pulling native-tls/openssl/openssl-sys
# (all banned in deny.toml due to supply-chain surface area + licensing).
# `default-features = false` disables the default `default-tls` (native-tls).
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "charset", "rustls-tls"] }

# File watching
notify = { version = "7.0", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-attributes = "0.1"

# NLP-specific
aho-corasick = "1.1"
unicode-segmentation = "1.12"
# SIMD-accelerated string search/split/hash — 10+ GB/s via AVX-512/NEON/SVE.
# "std" (default) enables sz_find, sz_splits, Byteset, sz_hash.
# "cpus" (TIER 2) enables LevenshteinDistances + Fingerprints — add allocator-api2 polyfill.
stringzilla = "4.6"

# Statistics
ndarray = { version = "0.16", features = ["rayon"] }
statrs = "0.17"

# Hashing
rustc-hash = "2.1"
blake3 = "1.5.5"

# Schema
schemars = { version = "1.2", features = ["uuid1", "chrono04"] }

# Text buffers
ropey = "1.6"

# AST parsing.
#
# ABI PIN: the `tree-sitter` runtime is 0.24, which loads grammars whose
# generated `parser.c` targets ABI <= 14. Grammar crates on the 0.25.x line
# are ABI 15 — the 0.24 runtime rejects them at `Parser::set_language`,
# surfacing as `AstError::GrammarUnavailable` ("Unsupported tree-sitter ABI").
# Every grammar below resolves to an ABI-14 parser EXCEPT `tree-sitter-md`
# (0.5.x is ABI 15); markdown therefore degrades gracefully rather than
# parsing. Before bumping any grammar, verify the ABI:
#   grep LANGUAGE_VERSION ~/.cargo/registry/src/*/tree-sitter-<x>-<ver>/**/parser.c
# Moving the whole set to ABI 15 means bumping `tree-sitter` to 0.25 and
# `ast-grep-core`/`ast-grep-language` to 0.42 in lockstep — a separate wave.
# Wave 5 (2026-05-23) closure: tree-sitter 0.24 -> 0.26 (ABI 15 runtime) +
# ast-grep 0.42 in lockstep. Mixed-ABI matrix preserved because grammars
# (html, typescript, java, ruby) have NO ABI-15 releases on crates.io; the
# 0.26 runtime accepts ABI-14 grammars gracefully. Per-grammar matrix
# verified via scripts/grammar-abi-resolver.sh on 2026-05-23.
#
# 2026-06-26 Opção B note: the `wasm` feature is OPTIONAL in tree-sitter
# 0.26, BUT tree-sitter 0.26 unconditionally depends on `wasmtime-c-api`
# (a wasmtime C-FFI binding) which transitively pulls `wasmtime v36`,
# creating a 19-crate duplicate cascade with touring-bindings's direct
# `wasmtime v46`. Downgrading to 0.25 would lose ABI 15 runtime support.
# Accepting as upstream-locked and tracked via deny.toml `[bans] skip`.
# 2026-08-02: both wasmtime lines carried RUSTSEC-2026-0222 (type-index
# confusion across engines, 3.8 LOW). Fixed by pinning the transitive line to
# 36.0.13 and lifting the direct dependency 44 -> 46 (first patched majors per
# the advisory). `cargo deny check advisories` is green; bind-wasm compiles.
tree-sitter = { version = "0.26", features = ["wasm"] }
tree-sitter-python = "0.25"      # ABI 15
tree-sitter-rust = "0.24"        # ABI 14 (transitional)
tree-sitter-typescript = "0.23"  # ABI 14 — no ABI 15 release exists
tree-sitter-javascript = "0.25"  # ABI 15
tree-sitter-html = "0.23"        # ABI 14 — no ABI 15 release exists
tree-sitter-css = "0.25"         # ABI 15
tree-sitter-json = "0.24"        # ABI 14/15 transition
tree-sitter-bash = "0.25"        # ABI 15 — Wave 5: removes bash_ast_validator tokenizer fallback
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = { version = "0.5", features = ["parser"] }  # ABI 15 — now natively parses

# MCP
rmcp = { version = "1.2", features = ["server", "transport-io", "macros"] }

# PyO3
pyo3 = { version = "0.29", features = ["extension-module"] } # >=0.29 fixes RUSTSEC-2026-0176 (PyList/PyTuple iterator OOB read) + RUSTSEC-2026-0177 (PyCFunction::new_closure Sync bound)
numpy = "0.29" # rust-numpy tracks pyo3 minor-for-minor; must move in lockstep with pyo3

# CRDTs for multi-agent convergence
crdts = "7.3"

# Semantic graph persistence
rkyv = { version = "0.8.17", features = ["std", "bytecheck"] }

# Memory-mapped I/O
memmap2 = "0.9"

# Compression
zstd = "0.13"

# Tokenization
tiktoken-rs = "0.9"

# WASM runtime (optional — for plugin system)
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime", "pooling-allocator"] }
wat = "1.245"

# Full-text search
tantivy = "0.22"

# Protobuf (optional — for SCIP binary emit)
prost = "0.13"
prost-types = "0.13"

# Misc
ignore = "0.4"
base64 = "0.22"
tempfile = "3.14"
streaming-iterator = "0.1.9"
futures = "0.3"

# Clustering (optional)
linfa = "0.7"
linfa-clustering = "0.7"
linfa-ftrl = "0.7"

# Snapshot testing (dev-dep in per-crate [dev-dependencies])
insta = "1.41"

# ── Wave 5 (2026-04-18) ecosystem integrations ─────────────────────────
# Enum ergonomics: iter/display/from_str derives. Used by touring-ast::Lang.
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
# Reduce derive boilerplate for newtype/wrapper errors.
derive_more = { version = "2.0", features = ["from", "display", "deref", "constructor"] }
# Collapse long feature-cfg chains into named aliases.
cfg_aliases = "0.2"
# Structure-aware fuzz input generation (dev-only).
arbitrary = { version = "1.4", features = ["derive"] }
derive_arbitrary = "1.4"
# Serialize tests touching SQLite / UnixSocket / daemon state.
serial_test = "3.1"
# CLI integration test harness (stdout/stderr/exit code matching).
predicates = "3"
# Unified property + fuzz + exhaustive test engine (dev-only).
# bolero = "0.13"          # TODO: add when cargo-bolero available; defer harness to fuzz_parsers.rs
# RustSec advisory database (CVE lookup). 0.33 supports CVSS v4.0 advisories
# (0.30 failed `Database::open` on the current advisory-db's CVSS-4.0 entries).
rustsec = { version = "0.33", default-features = false }
# Compile-time plugin/hook registration collected at link time.
inventory = "0.3"
# Production-grade jemalloc allocator + pprof heap profiling (feature-gated).
tikv-jemallocator = "0.6"
jemalloc_pprof = { version = "0.8", default-features = false, features = ["flamegraph"] }
# Breaking-API-change detection for Rust library crates.
public-api = { version = "0.47", default-features = false }
# ────────────────────────────────────────────────────────────────────────

# Static compile-time invariants (structs layout + trait impls)
static_assertions = "1.1"

# Property-based fuzzing (dev-dep) — alternative microbench (dev-dep).
# Both ranking-driven additions; per-crate dev-deps opt in as needed.
proptest = "1.5"
divan = "0.1"

# Cross-platform RSS + virtual memory sensor (~500 LOC, zero deps beyond libc
# on Unix / winapi on Windows). Feeds the touring-daemon telemetry map
# (`touring gate-metrics -j`) with live RSS / VM size for the current process
# — a prerequisite for detecting long-running leak drift without a heavy
# jemalloc-profile run. Exposed via `crate::shared::memory_stats_probe`.
memory-stats = "1.2"

# Drop-in replacement for std assert_eq!/assert_ne! with colored unified
# diffs — cuts token burn when Claude reads test failures in CI logs.
# Tier A (2026-04-19) — documented in Crates-para-Melhorar-Codigo-Touring.md.
pretty_assertions = "1.4"
# #[traced_test] attribute: captures and asserts against `tracing` events
# inside a test without scaffolding a custom subscriber. Pairs naturally
# with the 138-hook instrumentation that already emits spans.
tracing-test = "0.2"

# ── ML Inference (optional, W1 cognitive) ──────────────────────────────
# candle-core/nn/transformers: Rust-native ML framework for edge inference.
# GGUF quantized models (Q4_K_M / Q8_0) loaded into daemon memory for
# zero-latency embedding generation. Gated behind `semantic-embeddings`
# feature in consumer crates to avoid pulling ML deps when unused.
candle-core = { version = "0.8", default-features = false }
candle-nn = { version = "0.8", default-features = false }
candle-transformers = { version = "0.8", default-features = false }

# HuggingFace tokenizers — pure Rust WordPiece/BPE/SentencePiece. Required
# by CandleEmbedder Phase-2a to load `tokenizer.json` sidecar files shipped
# with every BGE/Nomic GGUF model. `http` default is disabled to avoid
# pulling reqwest (offline-first: caller stages tokenizer.json on disk).
tokenizers = { version = "0.20", default-features = false, features = ["onig", "esaxx_fast"] }

# ── Cognitive Memory (optional, W1 ADR Phase 3) ────────────────────────
# mentedb-cognitive: Curva-U attention + Delta-Aware Serving + Belief
# Propagation. Reported -90.7% token reduction in 20-turn loops, 0% stale
# returns. Gated behind `cognitive-memory` feature in touring-cortex —
# OFF by default per ADR D4 until v1.0 review completes.
# NOTE: version "0.3" was invalid (crates.io latest is "0.5.0"). Fixed 2026-04-16.
mentedb-cognitive = { version = "0.5", default-features = false }

# ── W2 forward-fix (2026-05-12): 99 deps missing after w2_centralize bug ──
# Bug: w2_centralize_workspace_deps.py --apply reported OK but did NOT merge
# staging proposal into [workspace.dependencies] root section. Detected after
# w2_propagate_workspace_inherit.py converted these deps to .workspace=true in
# 31 crate Cargo.toml files, causing cargo check to fail with
# "dependency.X was not found in workspace.dependencies".
# Resolution: deps appended in their original staging form (no features).
# Per-crate overrides for features (e.g., serde = { workspace = true,
# features = ["derive"] }) work normally since cargo inherits workspace
# version and the crate adds features.
# TODO(post-W2): consolidate this block with the structured deps above + add
# proper feature blocks for deps that need them. Bug fix to be filed in
# w2_centralize_workspace_deps.py to make --apply actually merge.
approx = "0.5"
arc-swap = "1.6"
assert_cmd = "2"
ast-grep-core = "=0.42.3"           # Wave 5 (2026-05-23) closure — lockstep with tree-sitter 0.26
ast-grep-language = "=0.42.3"       # Wave 5 (2026-05-23) closure
axum = "0.8"
aya = "0.13"
aya-log = "0.2"
bumpalo = "3.16"
bytemuck = "1"
bytes = "1"
capnp = "0.24"
capnp-futures = "0.24"
capnp-rpc = "0.24"
capnpc = "0.24"
cargo-mutants = "24.11.2"
cargo_metadata = "0.23"
clap = "4.5"
clap_complete = "4.5"
clap_mangen = "0.2"
console-subscriber = "0.4"
criterion = "0.5"
cvc5 = "0.4"
deadpool-postgres = "0.14"
dhat = "0.3"
home = "0.5" # replaces unmaintained `dirs` (RUSTSEC-2020-0053) for our direct home_dir() use; rust-lang-maintained (cargo uses it). dirs still enters the tree transitively via fastembed → ignored in deny.toml with that rationale
eframe = "0.34"
egui = "0.34"
# W13 repo-premium 2026-05-31: rustls TLS for BOTH the ort-sys ONNX downloader and
# the hf-hub model downloader (default pulls native-tls→openssl, banned by deny.toml).
# default = [ort-download-binaries-native-tls, hf-hub-native-tls, image-models].
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls", "image-models"] }
filetime = "0.2"
geo = "0.29"
geo-types = "0.7"
geozero = "0.15"
glob = "0.3"
globset = "0.4"
graphviz-rust = "0.9"
half = "2"
hashbrown = "0.15"
hdrhistogram = { version = "7.5", default-features = false }
hex = "0.4"
http-body-util = "0.1"
iai-callgrind = "0.16"
instant-distance = "0.6"
js-sys = "0.3"
leptos = "0.8"
leptos_axum = "0.8"
leptos_macro = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
libc = "0.2"
loom = "0.7"
memchr = "2"
mentedb-core = "0.5.0"
