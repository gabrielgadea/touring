# Dev deps declared per-crate, not workspace-level
# criterion, approx, proptest, rand, rstest, tempfile, tokio-test

# ── Dev profile: fast compilation + minimal disk footprint ────────────
# Disk-optimization wave (2026-04-26): aligned with Cargo Book recommendation
# (build-performance.html). Saves ~25 GB recurrent in target/debug:
#   • debug = "line-tables-only": keeps file/line for panics, drops types/locals
#   • incremental = true: the local incremental cache is the RIGHT cache for
#     iterative Rust dev. The prior "incremental = false: sccache assumes the
#     role (37-75%)" assumption was empirically FALSE (measured 2.29% Rust
#     hit-rate) and sccache is now disabled workspace-wide
#     (.cargo/config.toml `rustc-wrapper = ""`) — see that file for the
#     correctness rationale (stale-object hazard, binary ≠ source).
#     Trade-off: regenerates ~21 GB target/debug/incremental — acceptable
#     (disk-hygiene cron + safe-clean.sh manage it; REGRA #12).
#   • split-debuginfo = "unpacked": separates .dwo files (~30% rlib size cut)
# Use [profile.debugging] when you need full debug info for gdb/lldb.
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2     # optimize dependencies but not our code — best of both worlds
debug = false     # zero debug info on external deps — saves ~30% in target/debug/deps

# ── Opt-in profile: fast iteration with local incremental cache ───────
# Use when you're rapidly iterating on the same crate and sccache hit rate
# matters less than incremental rustc state. Trade-off: regenerates the
# 21 GB target/debug/incremental directory.
[profile.fast-iter]
inherits = "dev"
incremental = true
split-debuginfo = "off"

# ── Opt-in profile: full debug info for stepping in gdb/lldb ──────────
# `cargo build --profile debugging` brings back type/local debug symbols
# at the cost of larger rlibs.
[profile.debugging]
inherits = "dev"
debug = true

# ── Release profile: binary size optimization ─────────────────────────
[profile.release]
lto = "fat"         # full LTO — better dead code elimination (was "thin")
opt-level = "s"     # optimize for size instead of speed (was 3)
codegen-units = 1   # single codegen unit for best optimization
strip = true        # strip debug symbols
panic = "abort"     # no unwind tables — smaller binary (tests use dev profile)

# ── Bench profile ─────────────────────────────────────────────────────
[profile.bench]
lto = "thin"
opt-level = 3

# ── CI / mutation-testing profile ─────────────────────────────────────
# `cargo-mutants` auto-injects `--profile ci` (detected from
# `.config/nextest.toml`'s `[profile.ci]` section). Without a matching
# cargo profile, `cargo test --profile ci` errors with "profile `ci` is
# not defined". Mirror dev settings so `cargo test --profile ci` works
# identically to the default dev test path.
[profile.ci]
inherits = "dev"

[profile.ci.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Core: deny all standard clippy warnings — prevents compilation with issues.
# Priority -1 allows individual overrides at priority 0 (default).
all = { level = "deny", priority = -1 }
# Safety: `indexing_slicing` relaxed 2026-04-20 (Wave B aftermath). Rationale:
# noisy against idiomatic `serde_json::Value["key"] = …` assignments in CLI
# handlers and test-harness `vec[0]` patterns. Rustc's runtime bounds check
# still catches real panics; `clippy::all = deny` remains the primary floor.
indexing_slicing = "allow"
# Performance: catch inefficient patterns
needless_collect = "deny"
# Hygiene: forbid committed `dbg!` — zero current uses workspace-wide, so this
# locks the invariant at no cost (RBP-01 elite-lint ratchet, 2026-06-15).
dbg_macro = "deny"
# Supply-chain: forbid wildcard (`= "*"`) dependency versions — zero current uses
# in any workspace Cargo.toml; locks reproducible-build hygiene (RBP-01, 2026-06-15).
wildcard_dependencies = "deny"
# RBP-11 zero-violation elite-lint ratchets (2026-06-16): each enumerated to 0
# workspace violations via a `[workspace.lints]`-level `warn` pass over `--all-targets
# --keep-going` (the authoritative method — a `clippy -- -W` flag only reaches the
# top-level crate, NOT path-dep crates, which masked real violations on the first try).
# Denying these is a no-cost lock against future regression. (Five more candidates —
# empty_structs_with_brackets ×12, zero_sized_map_values ×4, unnecessary_self_imports
# ×2, verbose_file_reads ×1, empty_drop ×1 — had existing violations and were NOT
# added: each is style-level and several are intentional, not worth churning now.)
if_let_mutex                    = "deny" # MutexGuard held across the if-let arm = deadlock risk
rc_mutex                        = "deny" # Rc<Mutex<_>> antipattern (RefCell, or Arc across threads)
lossy_float_literal             = "deny" # f32 literal that silently loses precision
fn_to_numeric_cast_any          = "deny" # casting a fn item/ptr to a number is almost always a bug
mut_mut                         = "deny" # `&mut &mut T` is almost always a mistake
rest_pat_in_fully_bound_structs = "deny" # `S { a, b, .. }` when all fields are already bound

# ── Test-harness & pedantic allows ────────────────────────────────────
# Rationale: these lints fire heavily inside `#[cfg(test)]` modules and
# integration tests where the idiom under scrutiny is actually the
# clearest choice (regression guards on consts, manual numeric range
# checks, vec! with take-ownership semantics, dummy constants near `PI`,
# `len() == 0` preceding an empty check on a value that might later
# become a newtype, etc.). Keeping them at `warn`/`allow` preserves
# readability without weakening the core `clippy::all` floor.
assertions_on_constants       = "allow"
manual_range_contains         = "allow"
useless_vec                   = "allow"
let_unit_value                = "allow"
approx_constant               = "allow"
absurd_extreme_comparisons    = "allow"
field_reassign_with_default   = "allow"
useless_conversion            = "allow"
redundant_closure             = "allow"
len_zero                      = "allow"
manual_div_ceil               = "allow"
needless_update               = "allow"
unnecessary_map_or            = "allow"
int_plus_one                  = "allow"
# Common `expect(&format!(...))` → recognised defensive pattern in tests.
expect_fun_call               = "allow"
# `assert_eq!(x, true)` — minor readability, not worth rewriting test suites.
bool_assert_comparison        = "allow"

[workspace.lints.rust]
# Allow unexpected cfg values (e.g., rl-feedback feature removed due to cyclic dep)
unexpected_cfgs = "allow"
# Safety (RBP-01, 2026-06-15): require an explicit `unsafe {}` block for each unsafe
# op inside an `unsafe fn` body — the modern idiom that makes every unsafe call
# auditable. ENABLED workspace-wide: a `--keep-going` scan found only 4 violating
# sites, ALL in touchable crates (touring-intelligence ×2 `rkyv::archived_root`,
# touring-hooks `libc_kill`, touring-server `libc_getuid`) — none in the no-touch
# crates (they use the safe `check_archived_root`). All 4 were wrapped with SAFETY
# comments, so the deny holds clean.
unsafe_op_in_unsafe_fn = "deny"
