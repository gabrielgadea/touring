# ATENÇÃO: scripts/update-touring rotaciona `daemon-stderr.log` (HÍFEN) com teto de 10 MiB, mas o
# daemon grava `daemon.stderr.log` (PONTO). O arquivo que ele protege não existe; este cresce sem
# rotação (6,4 MB em 18/10/2026). Não é leitor: o `grep` por "daemon.stderr" o casava por engano.
leitores = []
retencao_dias = 30
expira = "apagar"
ts = { formato = "nenhum" }

# ── conjunto de arquivos avulsos (poda por mtime do arquivo, não por linha) ─────────────────────
