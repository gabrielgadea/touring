# Manifesto de journals do runtime (`~/.claude/touring`) — decisão N6, 17/10/2026.
#
# Cada journal declara: caminho, tipo, ESCRITORES, LEITORES (com a janela que cada um precisa),
# retenção, política de expiração e rollup. `scripts/journal_gc.py` poda SÓ o que este manifesto
# prova que ninguém precisa; `--verificar` confere o manifesto contra o código que ele nomeia.
#
# Janela de leitor (`janela_dias`):
#   N     o leitor lê só os últimos N dias; a retenção do journal precisa ser >= N
#   0     o leitor recebe o caminho por parâmetro (--trace PATH) e roda sobre cópia/arquivo:
#         não exige histórico no arquivo vivo
#   "toda"  o leitor lê o ARQUIVO INTEIRO (ou ninguém verificou). Bloqueia a poda — fail-closed.
#           Desbloquear é mudança no leitor (janelar, ou ler rollup + recente), nunca no manifesto.
# `verificada = true` só onde a janela foi lida no código; o resto é tratado como "toda".
#
# Expiração: `arquivar` move as linhas vencidas para `arquivo/<nome>.<AAAA-MM>.gz` (gzip, um
# membro por poda) e grava o rollup antes; `apagar` só descarta (permitido sem rollup apenas
# quando NINGUÉM lê o journal). Dias são UTC; timestamps sem offset agrupam pela data literal.
#
# ACHADOS DA PRIMEIRA PASSADA (18/10/2026):
#   * `oom_slice_gate.jsonl` é gravado por um hook do projeto analise
#     (`~/projects/analise/.claude/hooks/oom_slice_gate.py`, não versionado lá) — achado em 18/10/2026;
#     entra como escritor EXTERNO e sem leitor no Touring.
#   * Escritores sem leitor (REGRA #0): hooks_complement, compactions, daemon_crash, memwatch,
#     scope_shield, disk_watch, disk_cleanup, context_check, hw_slot, cpu_health, daemon_stderr,
#     logs_pontuais.
#   * Deriva de nome: `scripts/update-touring` rotaciona `daemon-stderr.log` (hífen), o daemon
#     grava `daemon.stderr.log` (ponto) — a proteção de 10 MiB nunca alcança o arquivo real.
#   * Leitores de arquivo inteiro: touring-code/journal.rs lê o run_journal.jsonl TODO (o KPI
#     code_mode_adherence é sobre o acervo inteiro), e kpi.rs lê o run_subcalls.jsonl TODO.
#   * `activity.jsonl` global está parado desde ~27/08 (o escritor atual grava em
#     `<projeto>/.claude/touring/`); a cópia global é resíduo.

versao = 1
base = "~/.claude/touring"

[censo]
diretorios = [".", "logs"]
extensoes = [".jsonl", ".log"]

# ── hook_trace: 1 linha por invocação de touring-hook (o maior arquivo do runtime) ──────────────
[[journal]]
id = "hook_trace"
caminho = "hook_trace.jsonl"
tipo = "jsonl"
escritores = ["crates/touring-hook-runtime/src/hook_trace.rs"]
leitores = [
  { arquivo = "crates/touring-cli/src/cli/kpi/daemon_availability.rs", janela_dias = 2, verificada = true, nota = "WINDOW_MS = 48 h" },
  { arquivo = "scripts/r3_latency_by_day.py", janela_dias = 0, verificada = true, nota = "--trace PATH: roda sobre cópia ou arquivo descomprimido" },
  { arquivo = "scripts/r3_prove_delivery.py", janela_dias = 0, verificada = true, nota = "--trace PATH; --lookback-days é relativo a --on-ts, sobre o arquivo passado" },
]
retencao_dias = 30
expira = "arquivar"
ts = { campo = "ts_ms", unidade = "epoch_ms" }
rollup = { agrupar_por = ["hook", "route", "exit_reason", "stdin_state"], somar = ["elapsed_ms", "stdin_bytes"] }

# ── oom_slice_gate: telemetria de um hook do projeto analise (escritor externo, ninguém no Touring lê) ──
[[journal]]
id = "oom_slice_gate"
caminho = "oom_slice_gate.jsonl"
tipo = "jsonl"
escritores = ["~/projects/analise/.claude/hooks/oom_slice_gate.py"]
leitores = []
retencao_dias = 30
expira = "apagar"
ts = { campo = "ts", unidade = "iso" }

# ── code mode ───────────────────────────────────────────────────────────────────────────────────
[[journal]]
id = "run_journal"
caminho = "run_journal.jsonl"
tipo = "jsonl"
escritores = ["crates/touring-server/src/tools/ctx_execute_tools.rs"]
leitores = [
  { arquivo = "crates/touring-code/src/journal.rs", janela_dias = "toda", verificada = true, nota = "read_journal percorre o arquivo inteiro" },
  { arquivo = "crates/touring-cli/src/cli/kpi/code_mode.rs", janela_dias = "toda", verificada = true, nota = "code_mode_adherence via journal::read_journal" },
  { arquivo = "crates/touring-code/src/sdk_signal_mirror.rs", janela_dias = "toda", verificada = true, nota = "journal::read_journal" },
  { arquivo = "scripts/gen_sdk.py", janela_dias = "toda" },
  { arquivo = "crates/touring-quality/src/builtins/best_practices.rs", janela_dias = "toda" },
  { arquivo = "crates/touring-cli/src/cli/health.rs", janela_dias = "toda" },
]
retencao_dias = 90
expira = "arquivar"
ts = { campo = "ts", unidade = "epoch_s" }
rollup = { agrupar_por = ["language", "failure_kind", "source"], somar = ["duration_ms", "bytes_elided", "code_hash_stdout_bytes"] }

[[journal]]
id = "run_subcalls"
caminho = "run_subcalls.jsonl"
tipo = "jsonl"
escritores = ["crates/touring-dispatch/src/daemon.rs"]
leitores = [
  { arquivo = "crates/touring-cli/src/cli/kpi.rs", janela_dias = "toda", verificada = true, nota = "code_mode_parallel_runs_from: read_to_string do arquivo" },
  { arquivo = "scripts/prova_code_mode_ceg.py", janela_dias = "toda" },
]
retencao_dias = 90
expira = "arquivar"
ts = { campo = "ts", unidade = "epoch_s" }
rollup = { agrupar_por = ["hook", "phase", "ok"], somar = ["duration_ms", "output_bytes", "payload_bytes"] }

[[journal]]
id = "sdk_signal_mirror"
caminho = "sdk_signal_mirror.jsonl"
tipo = "jsonl"
escritores = ["crates/touring-code/src/sdk_signal_mirror.rs"]
leitores = [
  { arquivo = "crates/touring-cli/src/cli/kpi/code_mode.rs", janela_dias = "toda", nota = "filtra por hook_dispatch_since_epoch (dinâmico); janela efetiva não verificada" },
  { arquivo = "crates/touring-quality/src/builtins/best_practices.rs", janela_dias = "toda", verificada = true, nota = "read_to_string do mirror inteiro" },
  { arquivo = "crates/touring-cli/src/cli/kpi.rs", janela_dias = "toda" },
]
retencao_dias = 90
expira = "arquivar"
ts = { campo = "ts", unidade = "epoch_s" }
rollup = { agrupar_por = ["hook_name", "success"], somar = ["duration_ms"] }

[[journal]]
id = "hooks_complement"
caminho = "hooks_complement.jsonl"
tipo = "jsonl"
escritores = ["crates/touring-hooks-shared/src/hooks_complement_journal.rs"]
