# KPI Commitments — Wave R2 (RFC-R2)
#
# Falsifiable thresholds for the touring workspace. Each commitment has:
#   - id: stable identifier (touring.<dim>.<metric>)
#   - name: human-readable label
#   - threshold: numeric or boolean target
#   - direction: gte | lte | eq
#   - source: where the actual value comes from
#       * daemon:<handler>:<json_pointer>  → in-process daemon handler
#       * external:<command>               → external subprocess (stub for now)
#
# Edit this file and re-run `touring kpi -j` to recompute.
# CI gate: `touring kpi --check` exits non-zero on any failed commitment.

version: "1.0"
schema: "kpi-commitments-v1"

commitments:
  - id: touring.wiring.orphans
    name: "Wiring orphan symbols"
    threshold: 100
    direction: lte
    advisory: true
    source: "daemon:cli-wiring-status:/orphan_count"
    rationale: "More than 100 orphans indicates significant wiring debt. ADVISORY (investigation 2026-07-01): the meter is not yet trustworthy — the count is cwd-sensitive (rust=5016 vs home=27088) and a Chain-7 spot-check found 3/4 sampled orphans have real consumers via grep (incomplete consumer population in wiring_map). Re-arm as blocking only after the wiring_map is repopulated and the FP rate is measured low."

  - id: touring.rl.ema_reward
    name: "RL EMA reward (OnlineRL engine)"
    threshold: 0.2
    direction: gte
    advisory: true
    source: "daemon:cli-learning-status:/ema_reward"
    rationale: "EMA reward < 0.2 means the RL loop hasn't converged yet. ADVISORY (investigation 2026-07-01): the value lives in the in-memory OnlineRLEngine, which resets on every daemon restart and re-injects a synthetic 0.2 warmup — so the first post-restart samples sit deterministically just under the 0.2 threshold (0.179606 observed byte-identical across days). A non-advisory gate on this source fails structurally after every restart without signalling anything. Re-arm only if the EMA gains durable persistence."

  - id: touring.cache.hit_ratio
    name: "Query cache hit ratio (W17/W18)"
    threshold: 0.5
    direction: gte
    advisory: true
    source: "daemon:cli-gate-metrics:/query_cache_hit_ratio"
    rationale: "Hit ratio >= 0.5 confirms cache is paying for itself. ADVISORY (2026-07-01): same structural pattern as ema_reward — the moka cache is in-memory and resets to 0.0 on every daemon restart (measured 0.0 → 0.71 post-warm, telemetry §1.4), so a non-advisory gate fails transiently after each restart without signalling anything. Re-arm if the ratio gains uptime-aware gating or persistence."

  - id: touring.p99.blast_timeout
    name: "Blast radius P99 timeout (D5)"
    threshold: 0
    direction: eq
    source: "daemon:cli-gate-metrics:/blast_timeout_count"
    rationale: "Any blast timeout indicates predictive layer regression."

  - id: touring.p99.mcts_deadlock
    name: "MCTS shadow deadlock detection (D5)"
    threshold: 0
    direction: eq
    source: "daemon:cli-gate-metrics:/mcts_shadow_deadlock_detected_count"
    rationale: "Deadlock detection guards async actor invariants."

  - id: touring.gotcha.resolution
    name: "Gotcha resolution count"
    threshold: 0
    direction: gte
    source: "daemon:cli-gotcha-stats:/resolved"
    rationale: "Gotchas should be progressively resolved over time."

  - id: touring.test.count
    name: "Total nextest count"
    threshold: 5100
    direction: gte
    source: "external:cargo nextest --list-tests | wc -l"
    rationale: "Test count is a leading indicator of confidence; do not regress."

  - id: touring.coverage.line
    name: "Line coverage (cargo llvm-cov)"
    threshold: 0.75
    direction: gte
    source: "external:cargo llvm-cov --workspace --lcov --summary-only"
    rationale: "75% line coverage is the minimum bar set by docs/ci-template.yml."

  # ─── Wave T2 (2026-04-25) — mutation testing ──────────────────────────────
  # Threshold ramps up per docs/mutation-testing.md (week 1-2 → month 3):
  #   week 1-2: 50  | week 3-4: 65  | month 2: 75  | month 3: 80 (target)
  # Source reads the cached report written by `touring mutation-test` (T1).
  # When the cache is empty (cache_miss / kind=cache_miss / kill_rate absent)
  # the kpi handler returns 0.0 and this commitment fails, but the gate in
  # run_full_audit.sh is advisory (skip-aware) so cold-start does not block.
  - id: touring.mutation.kill_rate
    name: "Mutation test kill_rate (touring-ast, advisory)"
    threshold: 50.0
    direction: gte
    source: "daemon:cli-mutation-test:/kill_rate"
    rationale: "Mutation testing measures how many fault injections the test suite catches. Week 1-2 baseline is 50% (advisory); ramps to 80% by month 3. See docs/mutation-testing.md."

  # ─── Wave F1 (2026-06-28) — coupling telemetry (node ⑦) ───────────────────
  # The touring.coupling.* family measures the EFFECTIVENESS of the LLM↔Touring
  # coupling channel delivered by R1-R6 (code-mode sans-MCP). All `advisory: true`
  # for a 2-week calibration window (docs/2026-06-27-coupling-telemetry-
  # infrastructure.md §1.4): thresholds sit below the measured baseline to force
  # improvement, so a miss is reported as ADVISORY (not FAIL) and excluded from
  # the `touring kpi --check` exit-code gate. ema_reward is already covered by
  # touring.rl.ema_reward (not duplicated here).
  - id: touring.coupling.str_bytes_per_emit
    name: "Coupling STR — enrichment bytes per emit (D2, leading)"
    threshold: 800.0
    direction: lte
    advisory: true
    source: "daemon:cli-gate-metrics:/enrichment_mean_bytes_per_emit"
    rationale: "Signal-to-token: bytes injected per enrichment emit. Measured baseline 1029; target lte 800 forces tighter context without losing the actionable signal."

  - id: touring.coupling.hook_latency_p50_us
    name: "Coupling hook dispatch latency p50 (D5, leading)"
    threshold: 1000.0
    direction: lte
    advisory: true
    source: "daemon:cli-gate-metrics:/hook_dispatch_latency/p50_us"
    rationale: "Common-case hook cost must stay ~1ms so enrichment is free at the point of action. Watches the median, not the cold-start tail (see p99)."

  - id: touring.coupling.hook_latency_p99_us
    name: "Coupling hook dispatch latency p99 (D5, leading)"
    threshold: 50000.0
    direction: lte
    advisory: true
    source: "daemon:cli-gate-metrics:/hook_dispatch_latency/p99_us"
    rationale: "Tail-latency guard (cold-start/cargo). Calibrated to 50ms — not 1ms — to watch the real tail without false alarms (telemetry §1.4)."

  - id: touring.coupling.actor_queue_wait_p99_us
    name: "Coupling actor queue-wait p99 — serialized-actor backpressure (D5, leading, F8)"
    threshold: 1000000.0
    direction: lte
    advisory: true
    source: "daemon:cli-gate-metrics:/actor_queue_wait/p99_us"
    rationale: "Time a RunHook waited in the per-project actor's serial mpsc before dequeue (F8, 2026-07-01). hook_dispatch_latency starts at dequeue, so this wait was invisible — it is the cross-session contention signal (one session's heavy hook stalling another's in the same project). >1s p99 = contention; advisory until a 2-week baseline exists."

  - id: touring.coupling.health_delta_net
    name: "Coupling health-delta net — improvements minus regressions (D4, lagging)"
    threshold: 0.0
    direction: gte
    advisory: true
    source: "derived:health_delta_net"
    rationale: "Net effectiveness: coupling-guided edits should improve more paths than they regress. Derived from gate-metrics health_delta_{improvement,regression}_count."

  - id: touring.coupling.world_model_success
    name: "Coupling world-model success rate — P(success|action) (D6, lagging)"
    threshold: 0.7
    direction: gte
    advisory: true
    source: "derived:world_model_success"
    rationale: "Mean P(success) across the durable action_world_model.json (21k+ examples). The cross-session learning signal; gte 0.70 indicates the harness is converging."

  - id: touring.coupling.suggestion_uptake
    name: "Coupling suggestion-uptake — redirect followed / emitted (D3, leading)"
    threshold: 0.4
    direction: gte
    advisory: true
    source: "derived:suggestion_uptake"
    rationale: "The decisive coupling KPI (telemetry §9, F2): after cli_suggester emits a touring/code-mode redirect, did the LLM's next same-session action follow it? followed/emitted over the daemon lifetime. gte 0.40 = the hint changes behaviour rather than being ignored (banner-blindness). Conservative 1-step window; STUB until the first suggestion is emitted."

  - id: touring.coupling.adoption_ratio
    name: "Coupling adoption_ratio — touring vs raw-bash among Bash actions (D3, the mother metric)"
    threshold: 0.5
    direction: gte
    advisory: true
    source: "derived:adoption_ratio"
    rationale: "The mother coupling KPI (telemetry §9, F3): the prior-bash->prior-touring inversion. Among Bash invocations, the fraction that call `touring` vs raw-shell antipatterns (grep/cat/find/sed) — touring/(touring+antipattern) over the daemon lifetime. Unconditional (every Bash action), unlike F2's suggestion-gated uptake. gte 0.50 = touring is the default reach, not the exception (the prior has flipped). STUB until the first Bash action is classified."

  - id: touring.coupling.pillar_induction_ratio
    name: "Coupling pillar-induction — pillar nudge followed / emitted (Task #6, armed-only)"
    threshold: 0.5
    direction: gte
    advisory: true
    source: "derived:pillar_induction_ratio"
    rationale: "Task #6 compounding structure (the active hook layer): after the armed pillar-induction layer nudges a differential the upstream classifiers miss (master-cli or learning-memory), did the LLM's next same-session action take it (a master/recall command)? followed/emitted over the daemon lifetime, precise predicate. gte 0.50 = the master commands are reached for once nudged. DEFAULT-OFF (TOURING_PILLAR_INDUCTION_ARMED) — STUB until armed; if it stays low while armed, that is the affordance-over-persuasion evidence (telemetry thesis ①) pushing toward productization."

  # ── ADW / Software Factory family (F6.4, plan 2026-07-19) ──────────────────
  # All advisory until the meters prove trustworthy (precedent: 2026-07-01
  # investigation). File-derived per project; STUB where no artifacts exist.

  - id: touring.adw.explore_rounds_to_dry
    name: "Explore rounds until CCE convergence (mean)"
    threshold: 8
    direction: lte
    advisory: true
    source: "derived:adw_explore_rounds_to_dry"
    rationale: "Measures the cost of honest exploration: mean rounds until the CCE ledger converges. Persistently above 8 suggests lenses are yielding too slowly or targets are unbounded."

  - id: touring.adw.plan_refine_iters
    name: "Plan refinement iterations (max)"
    threshold: 2
    direction: gte
    advisory: true
    source: "derived:adw_plan_refine_iters"
    rationale: "A plan that never survived >= 2 refine iterations was accepted on first draft — the 19/07 failure mode. STUB until any .refine.json exists."

  - id: touring.adw.runs
    name: "ADW runs recorded in this project"
    threshold: 1
    direction: gte
    advisory: true
    source: "derived:adw_runs"
    rationale: "Adoption meter for the durable runner (adw_runs >= 1 means the factory is actually used here, not just installed)."

  - id: touring.adw.router_accuracy
    name: "Factory router accuracy (completed / routed outcomes)"
    threshold: 0.7
    direction: gte
    advisory: true
    source: "derived:adw_router_accuracy"
    rationale: "Proxy: fraction of routed runs that completed. Below 0.7 the router is sending tickets to workflows that do not finish — retrain rules or arm the LLM fallback."

  - id: touring.adw.zte_bypass_rate
    name: "ZTE bypass rate (bypasses per finished run)"
    threshold: 0.5
    direction: lte
    advisory: true
    source: "derived:adw_zte_bypass_rate"
    rationale: "The conformal bypass must remain the audited exception. Above 0.5 the human gate is being skipped more often than exercised — tighten zte_warmup or review the confidence model."

  - id: touring.flow.compliance_ratio
    name: "Gated-flow OUTER compliance (artifact manifests complete at Stop)"
    threshold: 0.9
    direction: gte
    advisory: true
    source: "derived:flow_compliance"
    rationale: "Fraction of Stop-gate evaluations where the flow's artifact manifest (diagnostic + ledger + strategy doc) was complete. Below 0.9 the orchestrator is reaching end-of-turn without the protocol evidence — the anti-regression meter for protocol-adherence-diagnosis:2026-07-23. STUB until a gated flow runs here."

  - id: touring.memory.corpus_coverage
    name: "Memory entries reachable by ANN recall (indexed / stored)"
    threshold: 0.95
    direction: gte
    advisory: true
    source: "derived:memory_corpus_coverage"
    rationale: "Entries absent from the ANN corpus are 4.3x more likely to never be recalled (measured 2026-08-02: 50.9% never-read outside the corpus vs 11.8% inside). This drifted to 0.797 for weeks with a one-command remedy — `touring memory reindex` — and nothing measured it, so nobody could see it. Below 0.95: run the reindex."

  - id: touring.memory.curated_recall_share
    name: "Recall share landing on curated lessons, not auto-recorded outcomes"
    threshold: 0.5
    direction: gte
    advisory: true
    source: "derived:memory_curated_recall_share"
    rationale: "Before the 2026-08-02 filter the eight most-recalled entries in the whole store were all `outcome:*:failure`, and automatic entries were retrieved 2.4x more often than curated lessons — the ACO pheromone diluted by its own exhaust. This is the anti-regression meter for that fix; a fall back below 0.5 means noise is crowding the channel again."

  - id: touring.memory.never_recalled_ratio
    name: "Stored entries no recall has ever returned"
    threshold: 0.25
    direction: lte
    advisory: true
    source: "derived:memory_never_recalled_ratio"
    rationale: "Dead weight in the store: written once, never read. 0.200 at 2026-08-02. Rising means either the corpus is drifting again (see corpus_coverage) or entries are being written in a shape recall cannot match."
