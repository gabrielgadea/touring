# AUTO-GENERATED — Mirror docs.rs build locally before release
name: docs.rs Build Mirror

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'crates/**/Cargo.toml'
      - 'crates/**/src/lib.rs'

jobs:
  docs-rs-build:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "--cfg docsrs -D warnings"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install system deps (capnp + libpython — all-features pulls bind-capnp/pyo3)
        run: sudo apt-get update && sudo apt-get install -y capnproto libpython3.12-dev
      - name: Mirror docs.rs build
        run: |
          cargo +nightly doc \
            --workspace \
            --no-deps \
            --all-features
