id: multi-lang:hardcoded-secret
language: multi-lang
pattern: "API_KEY"
description: "Hardcoded secret-like identifier in source. Rotate immediately if leaked."
severity: high
resolution: |
  - Move secrets to environment variables or a secret manager (Vault, AWS Secrets Manager)
  - Add the file to `.gitignore` if it contains real values
  - Rotate the secret if this code was ever committed
metadata:
  introduced: 2026-04-25
