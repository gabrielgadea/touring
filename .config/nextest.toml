# cargo-nextest configuration
# Docs: https://nexte.st/docs/configuration/

[store]
dir = "target/nextest"

# Default profile — used locally by `cargo nextest run`
[profile.default]
# retries = 0 (21/08/2026): local retries hid the same shared-daemon starvation
# class the CI profile hid — a test that passes only on retry is a finding.
retries = 0
# Fail fast on first real failure after retries exhausted.
fail-fast = false
# Show output of failing tests immediately.
failure-output = "immediate-final"
# Hide successful test output (reduce noise on 5100+ tests).
success-output = "never"
# Flag tests taking >60s so we can hunt down slow tests.
slow-timeout = { period = "60s", terminate-after = 4 }
# Minimum verbosity for test status.
status-level = "retry"

# CI profile — used with `cargo nextest run --profile ci`
[profile.ci]
# retries REMOVED 21/08/2026: three automatic retries converted a whole class of
# shared-daemon starvation failures into "flaky-passed" and hid it for weeks
# (measured: `nextest --no-fail-fast` = 17 failures, all of that class; with
# retries, zero). A test that needs a retry to pass is a finding, not noise.
retries = 0
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
# JUnit XML for GitHub Actions / GitLab consumption.
junit = { path = "junit.xml" }
# Stricter slow detection in CI.
slow-timeout = { period = "90s", terminate-after = 3 }
status-level = "pass"

# Mutants profile — used by cargo-mutants (`.cargo/mutants.toml`).
#
# Mutation testing inverts what a failure MEANS: a failing test is the SIGNAL
# that the mutant was caught, not a flake to be re-run. The `ci` profile
# retries 3× with exponential backoff (up to 10s delay) and allows 90s × 3
# per test — so a mutant that a test correctly kills can consume minutes and
# get recorded as a TIMEOUT instead of a KILL. That is how 16 of 109 viable
# mutants in touring-identity became timeouts on 2026-08-20.
#
# Here: never retry, stop at the first failure (the mutant is already caught),
# and bound the hang tightly.
[profile.mutants]
retries = 0
fail-fast = true
slow-timeout = { period = "20s", terminate-after = 1 }
failure-output = "never"
success-output = "never"
status-level = "none"

# The daemon-db serialization applies here too — a mutant must not turn a
# shared-database race into a spurious kill.
[[profile.mutants.overrides]]
filter = "test(daemon) | test(hook_runtime)"
test-group = "daemon-db"

# Groups enable resource-aware scheduling. Tests touching
# the shared touring-daemon SQLite DB serialize via `daemon-db`.
[[profile.default.overrides]]
filter = "test(daemon) | test(hook_runtime)"
test-group = "daemon-db"

[[profile.ci.overrides]]
filter = "test(daemon) | test(hook_runtime)"
test-group = "daemon-db"

[test-groups]
daemon-db = { max-threads = 1 }

# Per-test timeouts — heavy E2E tests need room.
[[profile.default.overrides]]
filter = "test(e2e) | test(integration)"
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = "test(e2e) | test(integration)"
slow-timeout = { period = "180s", terminate-after = 2 }
