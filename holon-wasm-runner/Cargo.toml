[package]
name = "holon-wasm-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["THSF contributors"]
description = "THSF Fase 4 host runner — loads a WASM Component (WASI 0.2) and drives its `capabilities` interface."

[workspace]

[[bin]]
name = "holon-wasm-runner"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "42", features = ["component-model", "cranelift", "runtime"] }
wasmtime-wasi = "42"
anyhow = "1"
serde_json = "1"

[package.metadata.docs.rs]
all-features = true
