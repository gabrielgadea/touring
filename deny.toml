skip-tree = [
    # Legacy deps still on syn 1.x pending ecosystem migration.
    { crate = "syn@1", reason = "Legacy proc-macro deps still on syn 1.x pending ecosystem migration." },
    # 2026-08-02: two wasmtime lines coexist by construction — tree-sitter 0.26
    # unconditionally pulls `wasmtime-c-api` (the older major), while
    # touring-bindings depends on the current one directly. That fans out into a
    # ~23-crate cascade (cranelift-*, pulley-*, wasmtime-internal-*, wasm-encoder).
    # Enumerating each `crate@exact.version` — the previous approach — silently
    # rots on every bump: the RUSTSEC-2026-0222 fix (36.0.12→36.0.13, 44→46)
    # invalidated the whole list at once and turned `bans` red. skip-tree covers
    # the transitive closure, so the exemption survives patch bumps.
    { crate = "wasmtime@36", reason = "Transitive line via tree-sitter 0.26 → wasmtime-c-api; upstream-locked. Covers the whole cranelift/pulley/wasm-encoder cascade." },
    # windows-sys: foundational Win32 bindings — only present on a Windows/Mac
    # build lane. Unmatched on the Linux graph (harmless warning).
    { crate = "windows-sys", reason = "Foundational Win32 bindings; frequent minor bumps; Windows/Mac lane only." },
]

# ───────────────────────────────────────────────────────────────────────
# [licenses] — compliance gates
# ───────────────────────────────────────────────────────────────────────
[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "warn"

# Allow list — OSI-approved, permissive, enterprise-safe.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Scoped exceptions (the schema does not accept `reason`, explanations as comments):
# - ring: ships a custom license including OpenSSL components.
# - unicode-ident: required for unicode-aware tokenization.
# - inferno: CDDL-1.0 (weak-copyleft, file-level). Dev/profiling flamegraph
#   crate via pprof. Scoped exception — NOT a workspace-wide CDDL allowance.
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
    { allow = ["Unicode-3.0"], crate = "unicode-ident" },
    { allow = ["CDDL-1.0"], crate = "inferno" },
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

# ───────────────────────────────────────────────────────────────────────
# [sources] — only trust crates.io + our own git remotes
# ───────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
