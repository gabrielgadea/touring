# cargo-deny configuration
# Docs: https://embarkstudios.github.io/cargo-deny/
# Usage: cargo deny check
# Last refreshed: W13 repo-premium 2026-05-31 (advisories + bans skip-list + licenses).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false
# `full` feature in touring-generator activates every optional adapter.
features = ["full"]

# ───────────────────────────────────────────────────────────────────────
# [advisories] — RustSec database checks
# ───────────────────────────────────────────────────────────────────────
[advisories]
version = 2
# Deny on any unfixed vulnerability by default.
yanked = "deny"
# Canonical cargo-deny convention for workspace-private toolchains
# (https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html):
# flag unmaintained/unsound advisories ONLY on direct workspace deps.
# Transitive unmaintaineds are surfaced in `cargo audit` but do NOT
# penalise F4.5 — the workspace can't author-control a transitive's
# parent bump without disproportionate churn. Mirrored in
# `touring-analysis::quality::dep_health::load_advisory_policy`.
unmaintained = "workspace"
unsound = "workspace"
# Auto-expiry tripwire (cargo-deny best practice): when an ignored advisory stops
# matching — e.g. upstream inferno bumps quick-xml ≥0.41 — cargo-deny flags the
# entry as unused so it can be removed (the deferred REGRA #0 real fix lands here).
unused-ignored-advisory = "warn"
# Ignored advisories — each MUST carry a rationale. Review quarterly:
# if a safe upgrade becomes available, drop the entry here and bump the dep.
ignore = [
    # ── Unmaintained (no published fix; non-CVE) — each transitive or format-locked ──
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained (no CVE). DIRECT, but it serializes ANN embeddings to disk (touring-hooks-prediction/ann_memory/persistence.rs); bincode 1→2 is wire-format-incompatible → migrating would corrupt persisted data. Deferred to a scheduled data-format migration." },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained (no CVE) — transitive via argmin/measure_time/notify-types; web-time replacement lands as those parents bump." },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (no CVE) — transitive via gemm/argmin (math/proc-macro); compile-time proc-macro only, zero runtime attack surface." },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained (no CVE). DEV-ONLY + BUILD-TIME — pulled solely by iai-callgrind-macros → iai-callgrind, a [dev-dependencies] benchmark harness; never compiled into a shipped artifact. Zero runtime attack surface." },
    # RUSTSEC-2026-0185 (quinn-proto DoS) removed 2026-07-03 — qdrant-client bumped
    # quinn-proto to 0.11.15 (the fixed version); `cargo deny` + `unused-ignored-advisory`
    # both confirm the advisory no longer matches the tree. The deferred fix landed.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml <0.41 quadratic dup-attr-check DoS (CVE-class) — TRANSITIVE, sole parent `inferno` (flamegraph SVG) via (a) pprof [dev-dependencies] in touring-code [bench-only, never shipped] and (b) jemalloc_pprof `heap-profile`. inferno WRITES flamegraph SVG from the profiler's own LOCAL TRUSTED data; the quadratic-parse vector requires attacker-controlled XML, which never ingresses → unreachable. inferno 0.12.6 (latest, 2026-03-01) still pins quick-xml ^0.39; NO released inferno uses ≥0.41 → not fixable by upgrade. Tracked for the inferno bump; unused-ignored-advisory=warn auto-flags removal." },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml <0.41 NsReader unbounded namespace-declaration alloc DoS (CVE-class) — same `inferno` flamegraph-SVG transitive path as RUSTSEC-2026-0194. inferno's SVG writer does not parse untrusted namespaced XML via NsReader → vector unreachable. No released inferno uses quick-xml ≥0.41 (0.12.6 latest). Tracked; auto-expiry via unused-ignored-advisory=warn." },
    #
    # 2026-06-22 vuln-remediation wave (Gabriel: "corrija todas as vulnerabilidades") drove
    # `cargo audit` to VULNS=0 by FIXING — not deferring — every CVE previously ignored here:
    #   tokio-postgres RUSTSEC-2026-0178 → 0.7.18; postgres-protocol RUSTSEC-2026-0179/0180 → 0.6.12;
    #   rand RUSTSEC-2026-0097 → 0.10.1 / 0.9.3; gix-date RUSTSEC-2025-0140 → vergen-gix 1.0→10.0
    #   (gix 0.84, gix-date 0.15.4; build-info feature re-enabled with the vergen 10 Emitter/Gix API);
    #   pyo3 RUSTSEC-2026-0176/0177 → pyo3+numpy 0.24→0.29 (bind-python migrated: allow_threads→detach,
    #   PyObject→Py<PyAny>); lru RUSTSEC-2026-0002 (DIRECT) → 0.16.4; dirs RUSTSEC-2020-0053 (DIRECT) → `home`.
    # cargo-audit (whole-lock) still surfaces two NON-CVE warnings that cargo-deny's graph does not flag;
    # both are transitive and unfixable without a disproportionate parent bump (tracked, re-evaluate quarterly):
    #   - lru 0.12.5 [unsound] — internal to tantivy 0.22's cache (tantivy pins lru ^0.12; fix needs
    #     tantivy 0.22→0.24+, schema v5 deeply wired). Our DIRECT lru is patched (0.16.4 ≥0.16.3).
    #   - rustls-pemfile 2.2.0 [unmaintained] — transitive in the tls stack (folded into rustls-pki-types upstream).
]

# ───────────────────────────────────────────────────────────────────────
# [bans] — enforce a sane dependency graph
# ───────────────────────────────────────────────────────────────────────
[bans]
# Touring policy: deny duplicate versions in the graph (I-cache + binary bloat).
multiple-versions = "deny"
# Private-tooling workspace — wildcard path-deps are the canonical pattern.
wildcards = "allow"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "warn"

# Explicit deny list — TLS is rustls workspace-wide. openssl/native-tls are now
# fully ABSENT from the graph (W13 2026-05-31: fastembed switched to
# ort-download-binaries-rustls-tls + hf-hub-rustls-tls). This ban keeps them out.
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
    { crate = "native-tls", use-instead = "rustls" },
]

