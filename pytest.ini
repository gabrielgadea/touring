[pytest]
# The `post_build` marker (24/09/2026): tests that depend on the BUILT binary
# and therefore can only run after the build step of propagate-release.sh.
# Gate 1/6 runs the rite with `-m "not post_build"`; after the build + label
# check, the rite runs `-m post_build`, where they must pass.
markers =
    post_build: tests that need the built binary (run after the build step of propagate-release.sh)
