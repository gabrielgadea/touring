# ADW `strategy-loop` — the DETERMINISTIC prefix of the loop-engineering OUTER
# phase (steps 1-5): arm/refresh the outer marker with the bundle, recall
# memory, run the deep diagnostic, explore the topic until dry (CCE), then
# report the evidence manifest. The LLM synthesis (strategy doc) stays with the
# session orchestrator — its absence is enforced by the Stop guard
# (loop_outer_gate.py + flow_manifests.json), not by this run, so the adw exit
# code stays honest: this run completes when the deterministic artifacts exist.
# Origin: protocol-adherence-diagnosis:2026-07-23 (affordance over persuasion).
# Run: touring adw run strategy-loop --var topic="<topic>" \
#        --var scope="<project root>" --var bundle="<OKF bundle dir>"

[adw]
name = "strategy-loop"
description = "Deterministic OUTER of loop-engineering: marker + recall + diagnose + CCE explore + evidence report"
entry = "arm_marker"
budget_tokens = 0
# What this flow is FOR, so the portfolio can find it by intent rather than
# by filename. `when_not_to_use` is not modesty: it is the field that lets a
# search show a GAP instead of pitching the closest candidate.
[purpose]
intent = "Run the deterministic OUTER prefix of loop-engineering: arm the marker, recall, diagnose, explore until dry, report the evidence"
when_to_use = [
  "starting substantive work that owes a diagnostic doc and a CCE ledger on disk",
  "you want the OUTER artifacts produced by code rather than by narration",
]
when_not_to_use = [
  "as a substitute for the strategy synthesis — the doc is written by the session, and this run deliberately does not produce it",
  "a conversational question, where the whole OUTER is overhead",
]
inputs = [
  "topic",
  "scope",
  "bundle",
]
produces = [
  "an armed outer marker",
  "an OKF diagnostic",
  "a CCE ledger",
  "an evidence manifest",
]
tags = [
  "#kind:flow",
  "#domain:loop-engineering",
  "#process:outer",
]

# Veredito de prior-art (por que ESTE fluxo existe em vez de outro).
# O prefixo OUTER determinístico da loop-engineering. Não estende `explore-plan`:
# aquele explora um tema, este arma o marcador e produz os artefatos que o Stop
# hook cobra em disco.
prior_art_verdict = "create_new"


[node.arm_marker]
type = "code"
# SEM sandbox de propósito: este nó ESCREVE o marcador do flow guard
# (`loop_marker.py write`), e armar a guarda é o passo do qual todo o resto do
# turno depende — mantê-lo no caminho mais curto é uma escolha de robustez, não
# uma restrição técnica.
#
# ⚠ O que estava escrito aqui antes — que sandboxar o nó "trocaria a garantia
# por observabilidade" — foi MEDIDO em 24/08/2026 e é falso: sob `touring run`
# a escrita passa (a aplicação do CEG para shell é advisory, e o landlock vigente
# permite estes caminhos). A afirmação nunca tinha sido exercida.
#
# A escrita, essa sim, não aparece na sintaxe do shell — está dentro do programa.
# Era a cegueira do detector antigo; hoje `command_writes` a enxerga pelo VERBO
# em posição de subcomando (`loop_marker.py write`), e é o único nó da biblioteca
# classificado como escrita.
command = ["bash", "-c", "python3 ~/.claude/skills/loop-engineering/scripts/hooks/loop_marker.py write --task OUTER --status outer --flow strategy-outer --scope \"$1\" --bundle \"$2\" --cwd \"$1\"", "--", "{{vars.scope}}", "{{vars.bundle}}"]
timeout_ms = 30000
idempotent = true
on_pass = "recall"
on_fail = "recall"          # marker write is best-effort; the flow still runs

[node.recall]
type = "code"
sandbox = true
command = ["bash", "-c", "touring memory recall \"$1\" 2>&1", "--", "{{vars.topic}}"]
timeout_ms = 120000
idempotent = true
on_pass = "diagnose"
on_fail = "diagnose"        # empty recall is a valid result, never a blocker

# ⚠ pipefail (23/08/2026): o comando termina em `| tail`, e sem pipefail o exit
# era SEMPRE o do tail — o `on_fail = "__fail__"` declarado abaixo ficou
# inalcançável por 105 runs (medido por flow_redundancy.py: nenhum nó separou
# caso algum). O pipefail devolve ao nó o veredito que o spec sempre prometeu.
[node.diagnose]
type = "code"
sandbox = true
command = ["bash", "-c", "set -o pipefail; python3 ~/.claude/skills/loop-engineering/scripts/loop_diagnose.py --scope \"$1\" --topic \"$2\" --bundle \"$3\" --json 2>&1 | tail -c 1800", "--", "{{vars.scope}}", "{{vars.topic}}", "{{vars.bundle}}"]
timeout_ms = 900000
idempotent = true
on_pass = "explore_loop"
on_fail = "__fail__"        # no diagnostic evidence -> the OUTER cannot proceed

# `touring explore` loops-until-dry internally (CCE v2); the loop node re-drives
# it so late findings still count — the runner, not the agent, decides dryness
# from NEW_FINDINGS (Law L2). Same pattern as explore-plan.toml.
[node.explore_loop]
type = "loop"
body = "explore_round"
max_iters = 4
dry_rounds = 2
on_dry = "evidence_report"
on_pass = "evidence_report"
on_fail = "__fail__"

[node.explore_round]
type = "code"
sandbox = true
command = ["bash", "-c", "set -o pipefail; touring explore \"$1\" --scope \"$2\" 2>&1 | tail -c 1800", "--", "{{vars.topic}}", "{{vars.scope}}"]
timeout_ms = 900000
idempotent = true

[node.evidence_report]
type = "code"
sandbox = true
# Report-only (|| true): the summary carries the manifest verdict; the missing
# strategy-doc is the orchestrator's synthesis deliverable, enforced at Stop.
command = ["bash", "-c", "python3 ~/.claude/skills/loop-engineering/scripts/hooks/loop_outer_gate.py --json --no-emit || true"]
timeout_ms = 60000
idempotent = true
on_pass = "__end__"
on_fail = "__end__"
