# ADW `chore` (F3) — single light agent, never the heavy pipeline [video 20:31].
# Instantiate: touring adw from-template chore
# Run:         touring adw run chore --var task="<what>" --var verify_cmd="<gate command>"

[adw]
name = "chore"
description = "Single-agent light-tier chore with one verification gate"
entry = "do_chore"
budget_tokens = 0

[node.do_chore]
type = "agent"
driver = "claude"
tier = "light"
prompt = "Small chore, do exactly this and nothing more: {{vars.task}}"
allowed_tools = ["Read", "Grep", "Glob", "Edit", "Write"]
session = "resume_on_fail"
timeout_ms = 600000
on_pass = "verify"
on_fail = "__fail__"

[node.verify]
type = "gate"
command = ["bash", "-c", "{{vars.verify_cmd}}"]
timeout_ms = 300000
idempotent = true
on_pass = "__end__"
on_fail = "do_chore"
