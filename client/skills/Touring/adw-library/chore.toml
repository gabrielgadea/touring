# ADW `chore` (F3) — single light agent, never the heavy pipeline [video 20:31].
# Instantiate: touring adw from-template chore
# Run:         touring adw run chore --var task="<what>" --var verify_cmd="<gate command>"

[adw]
name = "chore"
description = "Single-agent light-tier chore with one verification gate"
entry = "prior_art"
budget_tokens = 0

# Prior-art first: even a chore should not re-create what exists (REGRA #0).
[node.prior_art]
type = "code"
command = ["bash", "-c", "touring portfolio \"$1\" --top 3 2>/dev/null | head -c 1500; true", "--", "{{vars.task}}"]
timeout_ms = 30000
idempotent = true
on_pass = "do_chore"
on_fail = "do_chore"

[node.do_chore]
type = "agent"
driver = "claude"
tier = "light"
prompt = "Small chore, do exactly this and nothing more: {{vars.task}}. Prior art already in the portfolio (evidence, not a constraint — reuse only if it genuinely fits): {{nodes.prior_art.summary}}"
allowed_tools = ["Read", "Grep", "Glob", "Edit", "Write"]
session = "resume_on_fail"
timeout_ms = 600000
on_pass = "verify"
on_fail = "__fail__"

[node.verify]
type = "gate"
command = ["bash", "-c", "{{vars.verify_cmd}}"]
timeout_ms = 300000
idempotent = true
on_pass = "__end__"
on_fail = "do_chore"
