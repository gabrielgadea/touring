# Central tier → model mapping (F3). Swap models here; every ADW follows.
# Node specs say `tier = "sota|workhorse|light"`; adw.py resolves via this table.
[tiers]
sota = "opus"
workhorse = "sonnet"
light = "haiku"
# aliases kept for older specs
mid = "sonnet"
fast = "haiku"

# Model family → effort for headless nodes (pool of 13/11/2026: opus medium · sonnet high ·
# haiku xhigh). adw.py passes `--effort`; a node's own `effort = "..."` overrides. Same table
# as client/hooks/model_pool.py (the `Agent` gate) — test_adw.py holds the two equal.
[effort]
opus = "medium"
sonnet = "high"
haiku = "xhigh"
