# Reproducible toolchain for CI ⇄ dev parity (BP2 / RBP-04, 2026-06-21).
# MSRV is declared separately as `rust-version = "1.95"` in Cargo.toml; this
# file pins the build *channel* and guarantees the required components are
# present so `cargo fmt`/`clippy` are always available in any checkout.
# No specific version is pinned (the workspace is fmt-/clippy-clean on the
# current stable, 1.95) to avoid an aging pin + an extra rustup download;
# stable must always stay >= MSRV 1.95.
#
# ⚠ This file OVERRIDES the rustup default inside this directory, including the
# default that `dtolnay/rust-toolchain@<ver>` sets in CI. Any job needing a
# different toolchain must say so explicitly with `cargo +<ver> ...` — a plain
# `cargo` here always resolves to `stable`. That silently defeated the MSRV job
# (it ran on stable, never on the declared MSRV) and the fuzz job (cargo-fuzz
# needs nightly for -Z sanitizer). Both were fixed on 2026-08-02.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
