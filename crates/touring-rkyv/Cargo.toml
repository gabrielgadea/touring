[package]
name = "touring-rkyv"
version = "0.1.0"
edition = "2024"
description = "Zero-copy serialization templates for touring crates"
license = "MIT OR Apache-2.0"

[dependencies]
rkyv = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde_json = { workspace = true }
proptest = { workspace = true }

[features]
# P2 da migração 0.8 (RUSTSEC-2026-0235): o rkyv 0.8 renomeou a feature de
# validação — `validation` deixou de existir e o mesmo papel passou a ser feito
# por `bytecheck`. O nome `validation` é PRESERVADO aqui como feature DESTA
# fachada para que nenhum consumidor precise mudar: ele apenas passa a encaminhar
# para `rkyv/bytecheck`. É o contrato da fachada em ação — a troca acontece neste
# arquivo, não nos crates que dependem dela.
default = ["std", "validation"]
std = ["rkyv/std"]
validation = ["rkyv/bytecheck"]

[[bench]]
name = "ipc_vs_json"
harness = false

[lints]
workspace = true
