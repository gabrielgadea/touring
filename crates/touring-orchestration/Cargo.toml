[package]
name = "touring-orchestration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Unified orchestration layer (W10 fusion) — dataflow pipelines (flow), Tasksfile YAML DSL (tasks), Devrcfile adapter (devrc)"

[features]
default = ["yaml", "templates"]
yaml = ["dep:serde_yaml"]
templates = ["dep:tera"]
http-client = ["dep:reqwest"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
serde_yaml = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
tera = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
