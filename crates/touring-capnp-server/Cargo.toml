[package]
name = "touring-capnp-server"
version = "0.1.0"
license.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true
description = "Cap'n Proto RPC server shim — implementation in touring-bindings/bind-capnp"
# Opt out of auto-discovery so `examples/util.rs` is treated as a shared
# module included via `#[path]`, not compiled as a standalone binary.
autoexamples = false

# Names are crate-qualified because `touring-bindings` ships examples with the
# same three basenames, and cargo writes every example of the workspace into a
# single `target/<profile>/examples/` directory. That collision was reported as
# debt on 07/08/2026 and left alone; on 09/08/2026 it stopped being cosmetic —
# two build jobs raced on the same output path and the workspace build died with
# `failed to remove file .../examples/bench_d34: No such file or directory`.
# The `path` keys keep the files where they are; only the artifact names change.
[[example]]
name = "capnp_bench_d34"
path = "examples/bench_d34.rs"

[[example]]
name = "capnp_bench_generator_health"
path = "examples/bench_generator_health.rs"

[[example]]
name = "capnp_client_demo"
path = "examples/client_demo.rs"

[lib]
name = "touring_capnp_server"

[dependencies]
touring-bindings = { path = "../touring-bindings" }

[features]
# bind-capnp ON by default so all existing consumers see the symbols
default = ["bind-capnp"]
bind-capnp = ["touring-bindings/bind-capnp"]

[dev-dependencies]
anyhow.workspace = true
capnp.workspace = true
capnp-rpc.workspace = true
futures.workspace = true
hdrhistogram.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["compat"] }
touring-foundation = { path = "../touring-foundation" }

[lints]
workspace = true
