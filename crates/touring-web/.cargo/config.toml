# getrandom 0.3 requires an explicit backend selection on wasm32-unknown-unknown
# (compile_error otherwise). Pairs with the `wasm_js` feature enabled in
# Cargo.toml's wasm32 target dependencies. See:
# https://docs.rs/getrandom/0.3/#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
