    const GOLD_ARROW_COLOR    = '#ffe27a';   // champagne   (1.00, 0.88, 0.48)

    /* Warm / mid / cool RGB triplets per edge kind. The mid stop is critical:
       a direct RGB lerp from orange (1, 0.6, 0) to cyan (0, 0.74, 0.83)
       produces a green-teal midpoint (0.5, 0.67, 0.42) which reads as "cold"
       across the entire edge. Routing through a magenta/violet midpoint keeps
       the warm→cool transition visually warm-then-cool rather than going
       through green territory. Pre-converted to [r,g,b] floats ∈ [0, 1]. */
    const LINK_GRADIENT = {
        // crate→crate skeleton ▸ blazing red → magenta → royal blue
        'crate-dep':    { warm: [1.00, 0.30, 0.18], mid: [0.93, 0.30, 0.78], cool: [0.42, 0.30, 1.00] },
        // workspace → ext::serde, ext::tokio ▸ rose → magenta → indigo
        'external-dep': { warm: [1.00, 0.34, 0.45], mid: [0.95, 0.30, 0.75], cool: [0.30, 0.18, 0.95] },
        // mod foo;  ▸ amber → orange-magenta → teal-cyan (warm hierarchy)
        'module-decl':  { warm: [1.00, 0.78, 0.20], mid: [1.00, 0.45, 0.55], cool: [0.10, 0.78, 0.78] },
        // symbol use ▸ orange-red → magenta → cyan-deep (width by symbol_count)
        'symbol-ref':   { warm: [1.00, 0.45, 0.20], mid: [0.95, 0.40, 0.70], cool: [0.20, 0.78, 0.92] },
        // file imports ▸ saturated orange → bright magenta → electric cyan
        'imports':      { warm: [1.00, 0.50, 0.05], mid: [1.00, 0.30, 0.65], cool: [0.05, 0.78, 1.00] },
    };

    /* Per-kind opacity. Architectural edges (crate-dep) sit on top, file imports
       fade into the mesh, module-decl sits in between since it captures hierarchy. */
    const LINK_OPACITY = {
        'crate-dep':    0.85,
        'external-dep': 0.62,
        'module-decl':  0.68,
        'symbol-ref':   0.58,
        'imports':      0.52,
    };

    /* Per-kind curvature (∈ [0, 0.6]). Larger values produce wider arcs.
       crate-dep gets the widest curve so the architectural skeleton arches
       above the file-import mesh; module-decl gets the tightest because
       parent→child hierarchy reads cleanest as a near-straight tether. */
    const LINK_CURVATURE = {
        'crate-dep':    0.45,
        'external-dep': 0.35,
        'module-decl':  0.16,
        'symbol-ref':   0.22,
        'imports':      0.26,
    };

    /* Number of bezier samples per link. 12 segments = 13 vertices. With
       3 500 edges this is ~45 500 vertices total, well within GPU budget
       and indistinguishable from continuous curves at typical viewport sizes. */
    const LINK_SEGMENTS = 12;

    /* Smoothstep pushes warm dominance into the first 60% of the line so
       output reads as warm, then transitions through mid (magenta), then
       arrives cool at the destination. Returns t ∈ [0,1] along the curve. */
    function gradientStop(t) {
        // Three-stop linear interpolation: warm@0 → mid@0.5 → cool@1.
        // Use cubic ease-in for warm phase to make warm linger.
        if (t <= 0.5) {
            const u = t / 0.5;
            const eased = u * u;             // ease-in: warm dominates
            return { stage: 0, k: eased };   // 0 → mid
        }
        const u = (t - 0.5) / 0.5;
        const eased = 1 - (1 - u) * (1 - u); // ease-out: cool arrives
        return { stage: 1, k: eased };       // mid → cool
    }

    function buildGradientLink(link) {
        const palette = LINK_GRADIENT[link.kind] || LINK_GRADIENT['imports'];
        const SEG = LINK_SEGMENTS;
        const N = SEG + 1;
        const positions = new Float32Array(N * 3);
        const colors    = new Float32Array(N * 3);

        // Per-vertex color: 3-stop interpolation through magenta/violet midpoint.
        for (let i = 0; i < N; i++) {
            const t = i / SEG;
            const { stage, k } = gradientStop(t);
            const a = stage === 0 ? palette.warm : palette.mid;
            const b = stage === 0 ? palette.mid  : palette.cool;
            colors[i*3+0] = a[0] * (1 - k) + b[0] * k;
            colors[i*3+1] = a[1] * (1 - k) + b[1] * k;
            colors[i*3+2] = a[2] * (1 - k) + b[2] * k;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('color',    new THREE.BufferAttribute(colors,    3));
        const mat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent:  true,
            opacity:      LINK_OPACITY[link.kind] || 0.5,
            depthWrite:   false,
            blending:     THREE.AdditiveBlending,
        });
        const line = new THREE.Line(geo, mat);
        line.frustumCulled = false;
        line.userData.linkRef = link;
        line.userData.SEG = SEG;
        line.userData.curvature = LINK_CURVATURE[link.kind] || 0.26;
        // Stable curve rotation hash so multiple parallel edges fan out
        // around the source-target axis instead of overlapping.
        const sId = String((link.source && link.source.id) || link.source || '');
        const tId = String((link.target && link.target.id) || link.target || '');
        let h = 0;
        const s = sId + '|' + tId + '|' + (link.kind || 'imports');
        for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff;
        line.userData.curveRotation = (h / 0xffff) * Math.PI * 2;
        return line;
    }

    /* Control point for the QuadraticBezierCurve3 — MUST replicate 3d-force-graph's
       internal formula exactly, otherwise the line we draw and the path along
       which native particles travel diverge in both direction (cross-product
       handedness) and magnitude (offset shrinks with Z-axis projection).

       3d-force-graph source (minified) computes:
         _ = g.clone()                  // g = (u - h)
              .multiplyScalar(l)        // g_scaled = g × curvature (NOT normalized)
              .cross(Z or Y)            // perp = g_scaled × world axis
              .applyAxisAngle(g.normalize(), p)
              .add(midpoint(h, u))
         curve = QuadraticBezierCurve3(h, _, u)

       Translating to inline math (Three.js cross product convention):
         If (dx ≠ 0 OR dy ≠ 0):  perp = (gsy, -gsx, 0)   // cross with Z
         Else:                    perp = (-gsz, 0, gsx)   // cross with Y
       where (gsx, gsy, gsz) = (dx, dy, dz) × curvature.

       Magnitude of perp = curvature × √(dx² + dy²)   (NOT curvature × length).
       This is the load-bearing detail: edges with a Z component get a flatter
       arc than a naive "perp × length × curvature" approach would produce,
       so the visible line MUST follow this same shrinkage to stay glued to
       the particles. */
    function _curveControlPoint(out, sx, sy, sz, tx, ty, tz, curvature, rotation) {
        const dx = tx - sx, dy = ty - sy, dz = tz - sz;
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz) || 1;

        // g_scaled = g × curvature
        const gsx = dx * curvature;
        const gsy = dy * curvature;
        const gsz = dz * curvature;

        // perp = g_scaled × world-axis (Z preferred; Y when g is along Z)
        let bx, by, bz;
        if (dx !== 0 || dy !== 0) {
            // cross(g_scaled, (0,0,1)) = (gsy, -gsx, 0)
            bx = gsy; by = -gsx; bz = 0;
        } else {
            // cross(g_scaled, (0,1,0)) = (-gsz, 0, gsx)
            bx = -gsz; by = 0; bz = gsx;
        }

        // Rodriguez: rotate perp around (dx, dy, dz)/len by `rotation`.
        const ux = dx / len, uy = dy / len, uz = dz / len;
        const ca = Math.cos(rotation), sa = Math.sin(rotation);
        const dot = ux*bx + uy*by + uz*bz;
        const rbx = bx*ca + (uy*bz - uz*by)*sa + ux*dot*(1 - ca);
        const rby = by*ca + (uz*bx - ux*bz)*sa + uy*dot*(1 - ca);
        const rbz = bz*ca + (ux*by - uy*bx)*sa + uz*dot*(1 - ca);

        // control = midpoint + rotated_perp (magnitude already baked in via g_scaled).
        out.x = (sx + tx) / 2 + rbx;
        out.y = (sy + ty) / 2 + rby;
        out.z = (sz + tz) / 2 + rbz;
    }

    /* Sample a quadratic bezier curve into the line's position buffer.
       Called from linkPositionUpdate every frame. The control point sits
       perpendicular to the source-target axis at `length × curvature`,
       rotated by a stable hash so parallel edges fan out. */
    const _ctrlPoint = { x: 0, y: 0, z: 0 };
    function updateGradientLinkPositions(line, sx, sy, sz, tx, ty, tz) {
        const SEG = line.userData.SEG || LINK_SEGMENTS;
        const positions = line.geometry.attributes.position.array;
        const curvature = line.userData.curvature || 0.26;
        const rotation  = line.userData.curveRotation || 0;
        _curveControlPoint(_ctrlPoint, sx, sy, sz, tx, ty, tz, curvature, rotation);
        const cx = _ctrlPoint.x, cy = _ctrlPoint.y, cz = _ctrlPoint.z;
        for (let i = 0; i <= SEG; i++) {
            const t = i / SEG;
            const omt = 1 - t;
            const a = omt * omt;     // (1-t)²
            const b = 2 * omt * t;   // 2(1-t)t
            const c = t * t;         // t²
            positions[i*3+0] = a * sx + b * cx + c * tx;
            positions[i*3+1] = a * sy + b * cy + c * ty;
            positions[i*3+2] = a * sz + b * cz + c * tz;
        }
        line.geometry.attributes.position.needsUpdate = true;
    }

    function buildNodeTooltipHtml(node) {
        const shellTxt = node.shell_level === PAULING.EXTERNAL_LEVEL ? 'extern' : ('K' + (node.shell_level || 0));
        const flagU = node.has_unsafe ? '<div class="gt-flag warn">⚠ unsafe</div>' : '';
        const flagO = node.is_orphan  ? '<div class="gt-flag danger">⛓ orphan</div>' : '';
        return ''
            + '<div class="graph-tooltip" style="border-color:' + (node.displayColor || node.baseColor) + ';">'
            +   '<div class="gt-name">' + escapeHtml(node.name) + '</div>'
            +   '<div class="gt-row"><span>crate</span><b>' + escapeHtml(node.crate) + '</b></div>'
            +   '<div class="gt-row"><span>shell</span><b style="color:' + PALETTE.electric + ';">' + shellTxt + '</b></div>'
            +   '<div class="gt-row"><span>quality</span><b style="color:' + AspectLens.qualityColor(node) + ';">' + (node.score || 0).toFixed(2) + '</b></div>'
            +   '<div class="gt-row"><span>cognitive</span><b style="color:' + AspectLens.cognitiveColor(node) + ';">' + (node.cognitive_score || 0).toFixed(2) + '</b></div>'
            +   '<div class="gt-row"><span>fan in/out</span><b>' + node.fan_in + '/' + node.fan_out + '</b></div>'
            +   flagU + flagO
            + '</div>';
    }
    function buildLinkTooltipHtml(l) {
        const sN = (l.source && l.source.name) || l.source;
        const tN = (l.target && l.target.name) || l.target;
        let c, kindBadge;
        if      (l.kind === 'crate-dep')    { c = '#7c4dff'; kindBadge = 'CRATE DEP'; }
        else if (l.kind === 'external-dep') { c = '#ff5c7a'; kindBadge = 'EXTERNAL'; }
        else if (l.kind === 'module-decl')  { c = '#00e5c0'; kindBadge = 'MOD ' + (l.tgtCrate ? '↓' : ''); }
        else if (l.kind === 'symbol-ref')   { c = '#26c6da'; kindBadge = 'SYMBOL ' + (l.symbolCount || 1) + 'x'; }
        else if (l.isCrossCrate)             { c = '#ff9800'; kindBadge = 'CROSS-CRATE'; }
        else                                  { c = '#00bcd4'; kindBadge = 'IMPORT'; }
        const subline = (l.srcCrate && l.tgtCrate)
            ? '<div class="gt-row" style="opacity:.7;font-size:10px;letter-spacing:1px;">'
                + escapeHtml(l.srcCrate) + ' → ' + escapeHtml(l.tgtCrate) + '</div>'
            : '';
        // For symbol-ref edges, expose the dominant symbol kind (function, struct, …).
        const detail = (l.kind === 'symbol-ref' && l.topKind)
            ? '<div style="opacity:.65;font-size:10px;margin-top:2px;">'
                + 'top kind: <strong>' + escapeHtml(String(l.topKind)) + '</strong>'
                + '</div>'
            : '';
        return ''
            + '<div class="link-tooltip" style="border-left:3px solid ' + c + ';">'
            +   '<div style="color:' + c + ';font-weight:700;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;">'
            +     escapeHtml(kindBadge) + '</div>'
            +   subline
            +   detail
            +   '<div style="margin-top:4px;">' + escapeHtml(String(sN)) + '</div>'
            +   '<div style="color:' + c + ';font-weight:700;">↓</div>'
            +   '<div>' + escapeHtml(String(tN)) + '</div>'
            + '</div>';
    }
    </script>
