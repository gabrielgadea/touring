[package]
name = "touring-pyright"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VGP layer 2 — synchronous stdio LSP client, pyright-langserver session and a warm per-project session pool (std + serde_json only; no async runtime, no hook crates)"

[lib]
name = "touring_pyright"
path = "src/lib.rs"

# Deliberately lean: the hook crates depend on this one, and `touring-lsp` (which optionally pulls
# `touring-hooks`) re-exports it — so nothing here may depend on touring-lsp, touring-hooks,
# touring-dispatch or touring-hook-handlers, or the package graph becomes cyclic again.
[dependencies]
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
